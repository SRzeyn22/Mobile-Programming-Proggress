<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" role="img" aria-label="Peta lipat dengan pin lokasi">
  <defs>
    <clipPath id="p1"><polygon points="30,120 135,95 135,250 30,272"/></clipPath>
    <clipPath id="p2"><polygon points="135,95 250,125 250,285 135,250"/></clipPath>
    <clipPath id="p3"><polygon points="250,125 365,95 365,255 250,285"/></clipPath>
  </defs>
  <!-- bayangan lembut di bawah peta -->
  <ellipse cx="200" cy="300" rx="120" ry="7" fill="#264653" opacity="0.08"/>
  <!-- ketebalan / tepi kertas (Sand) -->
  <polygon points="30,272 135,250 250,285 365,255 365,267 250,297 135,262 30,284" fill="#E9CFA8"/>
  <!-- panel 1 -->
  <g clip-path="url(#p1)">
    <rect x="20" y="80" width="130" height="210" fill="#CFE3DA"/>
    <path d="M20 150 C60 130 80 175 120 160 C135 155 140 170 150 168 L150 290 L20 290Z" fill="#8DB89E"/>
    <path d="M20 215 C50 200 70 235 100 225 C120 220 135 235 150 232 L150 290 L20 290Z" fill="#457B78" opacity="0.85"/>
    <circle cx="70" cy="135" r="9" fill="#F6F3EA" opacity="0.85"/>
  </g>
  <!-- panel 2 -->
  <g clip-path="url(#p2)">
    <rect x="125" y="80" width="135" height="220" fill="#DCEBE3"/>
    <path d="M125 175 C165 150 190 190 230 168 C245 160 255 172 262 170 L262 300 L125 300Z" fill="#A8C5B5"/>
    <path d="M150 90 C165 140 150 175 185 205 C205 225 195 255 215 290 L238 290 C222 250 232 228 208 196 C178 160 190 130 176 90Z" fill="#F6F3EA" opacity="0.95"/>
    <path d="M125 245 C160 232 195 262 262 240 L262 300 L125 300Z" fill="#457B78" opacity="0.85"/>
  </g>
  <!-- panel 3 -->
  <g clip-path="url(#p3)">
    <rect x="240" y="80" width="135" height="220" fill="#CFE3DA"/>
    <path d="M240 160 C280 140 300 185 335 165 C350 157 362 168 375 165 L375 300 L240 300Z" fill="#8DB89E"/>
    <path d="M240 238 C275 222 305 255 340 240 C352 235 365 242 375 240 L375 300 L240 300Z" fill="#457B78" opacity="0.85"/>
    <circle cx="322" cy="118" r="8" fill="#F6F3EA" opacity="0.85"/>
  </g>
  <!-- bayangan lipatan -->
  <polygon points="135,95 250,125 250,285 135,250" fill="#264653" opacity="0.05"/>
  <line x1="135" y1="95" x2="135" y2="250" stroke="#264653" stroke-opacity="0.12" stroke-width="1.5"/>
  <line x1="250" y1="125" x2="250" y2="285" stroke="#264653" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- tepi atas panel (highlight Sand) -->
  <polyline points="30,120 135,95 250,125 365,95" fill="none" stroke="#E9CFA8" stroke-width="5" stroke-linejoin="round"/>
  <polyline points="30,272 135,250 250,285 365,255" fill="none" stroke="#E9CFA8" stroke-width="3" stroke-linejoin="round"/>
  <!-- garis rute putus-putus -->
  <path d="M85 235 C120 215 150 235 185 214" fill="none" stroke="#F6F3EA" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <!-- bayangan pin -->
  <ellipse cx="205" cy="190" rx="22" ry="6" fill="#264653" opacity="0.28"/>
  <!-- pin lokasi (Coral) -->
  <path d="M205 190 C185 160 168 146 168 118 C168 96 184 80 205 80 C226 80 242 96 242 118 C242 146 225 160 205 190Z" fill="#D98964"/>
  <path d="M205 80 C226 80 242 96 242 118 C242 146 225 160 205 190 C214 160 222 140 222 118 C222 100 216 88 205 80Z" fill="#264653" opacity="0.14"/>
  <circle cx="205" cy="117" r="17" fill="#F6F3EA"/>
  <path d="M185 100 C190 92 198 88 206 88" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
</svg>
